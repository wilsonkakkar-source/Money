<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WM Financial"><title>WM Financial</title><meta name="theme-color" content="#0b3a6e"><title>WM Financial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-first column, a sticky month summary on top, four tabs in a bottom bar like a banking app. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --ink:#122033; --muted:#5b6879; --line:#dbe3ec;
  --in:#13795b; --out:#b4462f; --accent:#117aca; --accent-ink:#ffffff; --warn:#a36a00; --chip:#e7eef7;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1320; --surface:#131e2e; --ink:#e6edf6; --muted:#93a3b8; --line:#233247;
  --in:#4fc79c; --out:#ef8a72; --accent:#5aa9e6; --accent-ink:#06121f; --warn:#e2b04d; --chip:#1b2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1320; --surface:#131e2e; --ink:#e6edf6; --muted:#93a3b8; --line:#233247;
  --in:#4fc79c; --out:#ef8a72; --accent:#5aa9e6; --accent-ink:#06121f; --warn:#e2b04d; --chip:#1b2a3d; color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700}h1.brand{display:flex;align-items:center;gap:10px}h1.brand img{width:36px;height:36px;border-radius:9px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
h2{font-size:1.1rem;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.summary div{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary .num{font-size:1.15rem;font-weight:500}
.in{color:var(--in)} .out{color:var(--out)}

section{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .meta{font-size:.8rem;color:var(--muted)}
.row.done .name,.row.done .amt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.pay{background:color-mix(in srgb,var(--in) 7%,var(--surface))}
.daysep{padding:8px 14px 4px;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;border-top:1px solid var(--line);background:var(--bg)}
.panel .daysep:first-child{border-top:0}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.tick{appearance:none;width:30px;height:30px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--in) 18%,transparent);color:var(--in);font-weight:700}

.chip{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:600;letter-spacing:.02em;vertical-align:1px}
.chip.late{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.chip.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--out)}
button.link{border:0;background:none;padding:4px 0;color:var(--accent)}
.rowbtn{all:unset;display:contents;cursor:pointer}

details.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.wk summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:8px;align-items:baseline}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary .wl{font-weight:600}
details.wk[open] summary{border-bottom:1px solid var(--line)}
details.wk.now{border-color:var(--accent)}
.wkcell{display:flex;flex-direction:column;min-width:0;text-align:right}
.wkcell .num{font-size:.92rem}
@media (max-width:430px){details.wk summary{grid-template-columns:repeat(3,minmax(0,1fr))}details.wk summary .wl{grid-column:1/-1}.wkcell{text-align:left}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 4px;font-size:.78rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.sheet-back{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f .full{grid-column:1/-1}
form.f label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .grow{margin-right:auto}
.notice{padding:14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:30}
.askbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.85rem}
.askbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.chat{display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow:auto}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg.log{align-self:flex-start;font-size:.8rem;color:var(--muted);padding:2px 4px}
textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:72px;resize:vertical}
.alerts .row{grid-template-columns:auto minmax(0,1fr)}
.sev{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.sev.critical{background:color-mix(in srgb,var(--out) 18%,transparent);color:var(--out)}
.sev.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.sev.info{background:var(--chip);color:var(--muted)}
.sev.good{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.take{padding:12px 14px;white-space:pre-wrap;border-top:1px solid var(--line);font-size:.92rem}
.tl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:110px;padding:12px 14px 0}
.tl div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.tl i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--out)}
.tl i.ok{background:var(--in)}
.tlx{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:4px 14px 10px;font-size:.68rem;color:var(--muted);text-align:center}
.save{font-family:var(--mono);font-size:.8rem;color:var(--in);white-space:nowrap}
.status{border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface)}
.status.bad{background:color-mix(in srgb,var(--out) 12%,var(--surface));border-color:color-mix(in srgb,var(--out) 40%,var(--line))}
.status.good{background:color-mix(in srgb,var(--in) 12%,var(--surface));border-color:color-mix(in srgb,var(--in) 40%,var(--line))}
.status .big{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.15;text-wrap:balance}
.status .sub{color:var(--muted);font-size:.95rem}
.prog{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--in);transition:width .4s}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-top:1px solid var(--line);min-height:64px}
.todo:first-child{border-top:0}
.todo .t{font-weight:600;font-size:1.02rem}
.todo .d{color:var(--muted);font-size:.85rem}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem}
.ico.pay{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.ico.chk{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.ico.cash{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.more>summary{list-style:none;cursor:pointer;padding:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";color:var(--muted);font-weight:400}
details.more[open]>summary::after{content:"－"}
details.more[open]>summary{border-bottom:1px solid var(--line)}
details.more .panel{border:0;border-radius:0}
.allclear{padding:22px 16px;text-align:center;font-weight:600;color:var(--in)}
@media (prefers-reduced-motion:no-preference){.celebrate{animation:cel .5s ease-out}@keyframes cel{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border-radius:999px;font-weight:500;padding:10px 14px;text-align:left}
.askhero{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cat h3{font-size:.95rem;padding:10px 14px 2px;color:var(--muted);font-family:var(--body);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--out)}

.snapcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg,#1a7fd0,#0b3a6e);color:#fff;box-shadow:0 2px 10px rgb(11 58 110 / .28)}
.snapcard .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#d6e6f6;font-weight:600}
.snapcard .v{font-family:var(--mono);font-size:1.35rem;font-weight:500;letter-spacing:-.02em}
.snapcard .go{grid-row:1/3;grid-column:2;font-weight:600;color:#9fd4ff;font-size:.9rem;white-space:nowrap}
.snapcard .bar{grid-column:1/-1;background:rgb(255 255 255 / .18);height:8px;border-radius:4px;margin-top:6px}
.snapcard .bar i{background:#9fd4ff}
.snapcard .sm{grid-column:1/-1;font-size:.8rem;color:#d6e6f6}
.snap{gap:16px}
.snaphead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.snaphead button{min-width:44px;min-height:44px;padding:0;font-size:1.2rem}
.hero{border-radius:16px;padding:16px;background:linear-gradient(160deg,#1a7fd0,#0b3a6e);color:#fff;display:flex;flex-direction:column;gap:12px}
.hero .verdict{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div{background:rgb(255 255 255 / .1);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tiles .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:#d6e6f6;font-weight:600}
.tiles .v{font-family:var(--mono);font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.hero .bar{background:rgb(255 255 255 / .18);height:8px}
.hero .bar i{background:#9fd4ff}
.hero .sm{font-size:.82rem;color:#d6e6f6}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .bar{grid-column:1/-1;height:8px}
.catrow .bar i{background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

<script>

    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);

  // ---- dates (local calendar day, held as UTC midnight ms) ----

  const SB = {url:'https://ynyfuhcombwofvcufvfp.supabase.co', project:'ynyfuhcombwofvcufvfp',
    key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlueWZ1aGNvbWJ3b2Z2Y3VmdmZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzQ4MzgsImV4cCI6MjEwODM1MDgzOH0.2nzJtlVfIxqQp2gRzjoj-659Kv7Sf-2k_R8an0oMd7E'};
  const COLLS = ['bills','income','owed','paid','settings'];
  const NATIVE = (() => { try { return window.WMNative || null; } catch { return null; } })();
  const ls = {
    get(k) { try { const t = localStorage.getItem(k); if (t !== null) return JSON.parse(t); } catch {} try { const t = NATIVE && NATIVE.get(k); if (t) return JSON.parse(t); } catch {} return null; },
    set(k, v) { const t = JSON.stringify(v); try { localStorage.setItem(k, t); } catch {} try { NATIVE && NATIVE.set(k, v === null ? null : t); } catch {} },
  };
  const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, kk) => (o[kk] = x[kk], o), {}) : x);
  const SYNC = {
    t: null, base: null, cache: {}, loaded: new Set(), outbox: ls.get('sync-outbox') || {}, state: 'off', note: '', last: ls.get('sync-last'), busy: false, extra: null, timer: null,
    wrap(base) {
      this.base = base;
      for (const c of COLLS) { this.cache[c] = {}; base.collection(c).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); this.cache[c] = m; this.loaded.add(c); }, () => this.loaded.add(c)); }
      const self = this;
      return { collection(name) { const col = base.collection(name); return {
        doc(id) { const d = col.doc(id); return {
          async set(body) { await d.set(body); self.queue(name, id, JSON.parse(JSON.stringify(body))); },
          async delete() { await d.delete(); self.queue(name, id, null); } }; },
        onSnapshot: (...a) => col.onSnapshot(...a) }; } };
    },
    queue(c, i, d) { this.outbox[c + '/' + i] = {c, i, d}; ls.set('sync-outbox', this.outbox); if (this.t) setTimeout(() => this.now(), 300); },
    async flush() {
      const ops = Object.entries(this.outbox); if (!ops.length) return;
      await this.t.push(ops.map(([, o]) => o));
      for (const [k, o] of ops) if (this.outbox[k] === o) delete this.outbox[k];
      ls.set('sync-outbox', this.outbox);
    },
    async pull() {
      const rows = await this.t.pull(); const seen = {};
      if (!rows.length && COLLS.some(c => Object.keys(this.cache[c]).length)) throw new Error('not_allowed');
      for (const r of rows) {
        if (!COLLS.includes(r.c)) continue;
        const k = r.c + '/' + r.i; seen[k] = 1; if (this.outbox[k]) continue;
        const local = this.cache[r.c][r.i], ref = this.base.collection(r.c).doc(r.i);
        if (r.x) { if (local !== undefined) await ref.delete(); }
        else if (local === undefined || stable(local) !== stable(r.d)) await ref.set(r.d);
      }
      for (const c of COLLS) for (const i of Object.keys(this.cache[c])) if (!seen[c + '/' + i] && !this.outbox[c + '/' + i]) await this.base.collection(c).doc(i).delete();
    },
    async now() {
      if (!this.t || this.busy) return; this.busy = true; this.set('syncing');
      for (let n = 0; n < 50 && this.loaded.size < COLLS.length; n++) await new Promise(r => setTimeout(r, 100));
      try { await this.flush(); await this.pull(); this.last = Date.now(); ls.set('sync-last', this.last); this.set('ok', ''); }
      catch (e) { this.set('error', e && (e.code || e.message) || 'error'); }
      this.busy = false;
    },
    start(t) {
      this.t = t; this.now();
      clearInterval(this.timer); this.timer = setInterval(() => { if (!document.hidden) this.now(); }, 120000);
      if (!this.vis) { this.vis = true; document.addEventListener('visibilitychange', () => { if (!document.hidden) this.now(); }); }
    },
    stop(state, note) { this.t = null; clearInterval(this.timer); this.set(state || 'off', note || ''); },
    set(state, note) {
      const was = this.state + this.note; this.state = state; if (note !== undefined) this.note = note;
      if (was !== this.state + this.note && S.tab === 'money' && !document.querySelector('.sheet-back') && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
    },
  };
  function ago(t) { if (!t) return 'never'; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' hr ago' : Math.round(m / 1440) + ' days ago'; }
  function syncSection() {
    const pending = Object.keys(SYNC.outbox).length;
    const line = SYNC.state === 'ok' ? '✓ Up to date with your phone app and the twice-daily check · ' + ago(SYNC.last)
      : SYNC.state === 'syncing' ? 'Syncing…'
      : SYNC.state === 'error' ? (SYNC.note === 'signed_out' ? 'Signed out — sign in below to keep syncing.' : SYNC.note === 'not_allowed' ? 'That account can’t open this data. Sign in with your own email.' : SYNC.note === 'offline' ? 'No internet. Your changes are kept and will go up when you’re back online.' : 'Couldn’t sync just now. Your changes are kept and will go up next time.')
      : SYNC.state === 'blocked' ? SYNC.note
      : 'Not syncing yet.';
    return el('section', {}, el('div', {class:'sechead'}, el('h2', {}, 'Sync'), SYNC.t ? el('button', {onclick:() => SYNC.now()}, 'Sync now') : null),
      el('div', {class:'notice' + (SYNC.state === 'error' ? ' warn' : '')}, line, pending && SYNC.state !== 'ok' ? el('div', {class:'small muted'}, pending + ' change' + (pending === 1 ? '' : 's') + ' waiting to upload') : null),
      SYNC.extra ? SYNC.extra() : null);
  }
  function mcpTransport(mcp) {
    const run = async query => {
      const r = await mcp.callTool('Supabase', 'execute_sql', {project_id: SB.project, query}, {cache:false});
      let p = r.payload; if (Array.isArray(p)) return p;
      if (p && typeof p === 'object') p = p.result ?? JSON.stringify(p);
      if (typeof p !== 'string') p = (r.content || []).map(c => c.text || '').join('');
      const m = p.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data/);
      return JSON.parse(m ? m[1] : p);
    };
    const q = v => { const t = '$m' + Math.random().toString(36).slice(2, 8) + '$'; if (v.includes(t)) throw new Error('quote'); return t + v + t; };
    return {
      async pull() { const rows = await run("select coalesce(json_agg(json_build_object('c',collection,'i',id,'d',data,'x',deleted)),'[]'::json) as j from public.docs"); const j = rows[0] && rows[0].j; return typeof j === 'string' ? JSON.parse(j) : (j || []); },
      async push(ops) {
        const vals = ops.filter(o => COLLS.includes(o.c)).map(o => `(${q(o.c)}, ${q(String(o.i))}, ${q(JSON.stringify(o.d ?? {}))}::jsonb, ${o.d === null})`);
        if (vals.length) await run(`insert into public.docs (collection, id, data, deleted) values ${vals.join(', ')} on conflict (collection, id) do update set data = excluded.data, deleted = excluded.deleted; select 1 as ok`);
      },
    };
  }


  // ---- on-device store (same calls as the online version) ----
  const SEED = {bills:{}, income:{}, owed:{}, paid:{}, settings:{}};
  const KEY = 'wilsons-money-v1';
  function loadAll() {
    let st = null; try { const t = localStorage.getItem(KEY) || (window.WMNative && window.WMNative.get(KEY)); if (t) st = JSON.parse(t); } catch {}
    if (!st) { st = JSON.parse(JSON.stringify(SEED)); st._v = 4; return st; }
    if ((st._v || 1) < 3) {
      for (const [id, b] of Object.entries(SEED.bills || {})) if (st.bills && st.bills[id] && !st.bills[id].last_due && b.last_due) st.bills[id].last_due = b.last_due;
      st.paid ||= {}; for (const [id, p] of Object.entries(SEED.paid || {})) if (!st.paid[id]) st.paid[id] = p;
      st._v = 3; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
    }
    if (st._v < 4) {
      const n = st.income && st.income['nyu-grossman-payroll'];
      if (n && +n.amount === 1260.72) Object.assign(n, SEED.income['nyu-grossman-payroll']);
      st._v = 4; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
    }
    return st;
  }
  let STORE = loadAll();
  const listeners = {};
  function persist() { const t = JSON.stringify(STORE); let ok = false; try { localStorage.setItem(KEY, t); ok = true; } catch {} try { if (window.WMNative) { window.WMNative.set(KEY, t); ok = true; } } catch {} if (!ok) toast('Couldn’t save on this phone.'); }
  const docsOf = name => Object.entries(STORE[name] || {}).map(([id, d]) => ({id, exists:true, data:() => d}));
  function emit(name) { (listeners[name] || []).forEach(fn => fn({docs:docsOf(name)})); }
  const localDB = {
    collection(name) {
      return {
        doc(id) { return {
          async set(body) { (STORE[name] ||= {})[id] = JSON.parse(JSON.stringify(body)); persist(); emit(name); },
          async delete() { if (STORE[name]) delete STORE[name][id]; persist(); emit(name); },
        }; },
        onSnapshot(fn) { (listeners[name] ||= []).push(fn); setTimeout(() => fn({docs:docsOf(name)}), 0); return () => {}; },
      };
    },
  };
  function backupText() { return JSON.stringify(STORE); }
  function restoreFrom(text) {
    const d = JSON.parse(text);
    if (!d || typeof d !== 'object' || !d.bills) throw new Error('bad');
    STORE = d; persist(); ['bills','income','owed','paid','settings'].forEach(emit);
    for (const c of COLLS) for (const [i, v] of Object.entries(STORE[c] || {})) SYNC.queue(c, i, v);
  }

  // ---- Supabase sign-in + REST sync (phone app) ----
  const AUTH = { s: ls.get('sb-session') };
  function saveSession(j) { AUTH.s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email:(j.user && j.user.email) || (AUTH.s && AUTH.s.email) || ''}; ls.set('sb-session', AUTH.s); }
  function signedOut() { AUTH.s = null; ls.set('sb-session', null); SYNC.stop('error', 'signed_out'); }
  async function authPost(path, body) {
    const r = await fetch(SB.url + path, {method:'POST', headers:{apikey:SB.key, 'content-type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.msg || j.error_description || j.message || ('Error ' + r.status)); e.status = r.status; e.code = j.error_code || j.code; throw e; }
    return j;
  }
  async function refreshSession() {
    try { saveSession(await authPost('/auth/v1/token?grant_type=refresh_token', {refresh_token:AUTH.s.refresh_token})); }
    catch (e) { if (e.status === 400 || e.status === 401) signedOut(); throw new Error(e.status ? 'signed_out' : 'offline'); }
  }
  async function api(path, opts = {}, again = true) {
    if (!AUTH.s) throw new Error('signed_out');
    if (AUTH.s.expires_at * 1000 < Date.now() + 60000) await refreshSession();
    let r;
    try { r = await fetch(SB.url + path, {...opts, headers:{apikey:SB.key, Authorization:'Bearer ' + AUTH.s.access_token, 'content-type':'application/json', ...(opts.headers || {})}}); }
    catch { throw new Error('offline'); }
    if (r.status === 401 && again) { await refreshSession(); return api(path, opts, false); }
    if (r.status === 403) throw new Error('not_allowed');
    if (!r.ok) throw new Error('Error ' + r.status);
    return r;
  }
  const restTransport = {
    async pull() { return (await api('/rest/v1/docs?select=c:collection,i:id,d:data,x:deleted')).json(); },
    async push(ops) { await api('/rest/v1/docs?on_conflict=collection,id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(ops.map(o => ({collection:o.c, id:String(o.i), data:o.d ?? {}, deleted:o.d === null})))}); },
  };
  function restStart() { if (AUTH.s) SYNC.start(restTransport); else SYNC.set('off', ''); }
  window.__wmResume = () => { if (AUTH.s) SYNC.now(); };
  SYNC.extra = () => {
    if (AUTH.s) return el('div', {class:'actions', style:'justify-content:space-between;align-items:center'},
      el('span', {class:'small muted'}, 'Signed in as ' + (AUTH.s.email || 'you')),
      el('button', {onclick:() => { signedOut(); SYNC.set('off', ''); render(); }}, 'Sign out'));
    const email = el('input', {type:'email', autocomplete:'email', placeholder:'Email', 'aria-label':'Email'});
    const pass = el('input', {type:'password', autocomplete:'current-password', placeholder:'Password (8+ characters)', 'aria-label':'Password'});
    const msg = el('p', {class:'small', style:'margin:0', hidden:true});
    const say = (t, bad) => { msg.textContent = t; msg.className = 'small ' + (bad ? 'out' : 'muted'); msg.hidden = false; };
    const go = async create => {
      const e = email.value.trim(), p = pass.value;
      if (!e || p.length < 8) { say('Enter your email and a password of at least 8 characters.', true); return; }
      inBtn.disabled = upBtn.disabled = true;
      try {
        const j = await authPost(create ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', {email:e, password:p});
        if (j.access_token) { saveSession(j); toast('Signed in. Syncing…'); render(); SYNC.start(restTransport); return; }
        say('Almost done: open the email from Supabase and tap the confirm link. The page it opens may show an error — that’s fine. Then come back here and tap Sign in.', false);
      } catch (err) {
        say(/confirm/i.test(err.message) ? 'Your email isn’t confirmed yet. Tap the link in the Supabase email first, then Sign in.'
          : /invalid login/i.test(err.message) ? 'Wrong email or password. First time here? Tap Create account.'
          : /already registered|already exists/i.test(err.message) ? 'You already have an account. Tap Sign in.'
          : err.status ? err.message : 'No internet right now. Try again in a bit.', true);
      }
      inBtn.disabled = upBtn.disabled = false;
    };
    const inBtn = el('button', {class:'primary', onclick:() => go(false)}, 'Sign in');
    const upBtn = el('button', {onclick:() => go(true)}, 'Create account');
    return el('div', {class:'panel', style:'padding:14px;display:flex;flex-direction:column;gap:10px'},
      el('div', {class:'name'}, 'Sign in to sync'),
      el('p', {class:'small muted', style:'margin:0'}, 'Keeps this app, your Claude link and the twice-daily email check on the same numbers. First time: tap Create account, confirm the email, then Sign in.'),
      email, pass, msg, el('div', {class:'actions', style:'justify-content:flex-start'}, inBtn, upBtn));
  };

  // ---- data ----
  render();
  (async () => {
    const db = localDB;
    S.dbChecked = true;
    S.db = SYNC.wrap(db);
    try { const k = localStorage.getItem('anthropic-key'); if (k) enableApiSample(k); } catch {}
    restStart();
    const sub = (name, fn) => db.collection(name).onSnapshot(snap => { fn(snap.docs.filter(d => d.exists).map(d => ({id:d.id, ...d.data()}))); S.ready[name] = true; render(); },
      e => { S.ready[name] = true; render(); toast('Lost connection to your data. Reopen the page to refresh.'); });
    sub('bills', rows => S.bills = rows);
    sub('income', rows => S.income = rows);
    sub('owed', rows => S.owed = rows);
    sub('paid', rows => S.paid = new Set(rows.map(r => r.id)));
    sub('settings', rows => { const m = rows.find(r => r.id === 'main'); S.settings = m ? {balance:m.balance, as_of:m.as_of} : {}; });
    render();
  })();
})();
